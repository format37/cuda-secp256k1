# Builds every target with nvcc and runs the OpenSSL differential tests.
# GitHub's runners have no GPU, so the tests run their kernel work on the
# host (CUDA_SECP256K1_HOST_ONLY=1); the device code is still compiled.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA 12.8 (nvcc and runtime headers) and OpenSSL
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-8 cuda-cudart-dev-12-8 libssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_CUDA_COMPILER=/usr/local/cuda-12.8/bin/nvcc -DCMAKE_CUDA_ARCHITECTURES=89

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test on the host path
        env:
          CUDA_SECP256K1_HOST_ONLY: 1
          CUDA_SECP256K1_N: 2048
        run: cd build && ctest --output-on-failure
